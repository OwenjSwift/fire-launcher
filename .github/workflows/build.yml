name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Get the built-in beach photo (Sean Oulashin, Unsplash Licence)
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          curl -fsSL "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1920&h=1080&fit=crop&q=85&fm=jpg" \
            -o app/src/main/res/drawable-nodpi/wallpaper.jpg
          ls -l app/src/main/res/drawable-nodpi/

      - name: Build the app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk glasshome.apk

      - name: Publish it as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Glass Home build ${{ github.run_number }}
          body: |
            Install on your Fire TV with Downloader using (all lowercase):
            github.com/owenjswift/fire-launcher/releases/latest/download/glasshome.apk
          files: glasshome.apk
          make_latest: true
